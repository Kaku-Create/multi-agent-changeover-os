services:
  changeover:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-agent-changeover:2.0.0
    container_name: changeover-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      DB_FILE: changeover.db
      LOG_LEVEL: info
      SEED: "20261002"
      SEED_ON_EMPTY: "true"
      ENABLE_LIVE_SIMULATOR: "true"
      LIVE_TICK_MS: "3000"
      RATE_LIMIT_MAX: "1200"
      CORS_ORIGIN: "*"
    volumes:
      - changeover-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  changeover-data:
    driver: local
